name: Dependency Review

# Reusable workflow called from build.yml. Scans dependency manifest files
# changing in a PR for known-vulnerable packages, using the rules in
# .github/config/dependency-review-config.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Morphe-PDF: blocking. Dependency graph is now enabled on this repository, so a PR
      # that introduces a vulnerable dependency fails here rather than being merged and
      # found later by the scheduled scan.
      #
      # This checks the PR DIFF, not the existing tree, so the two accepted dev-only npm
      # advisories (extract-zip, fast-uri) do not trip it. Severity threshold is the
      # action's default; add fail-on-severity to .github/config/dependency-review-config.yml
      # if that proves too strict, and allow-ghsas there for anything formally accepted.
      - name: "Dependency Review"
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: "./.github/config/dependency-review-config.yml"
