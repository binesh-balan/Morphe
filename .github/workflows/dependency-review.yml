name: Dependency Review

# Reusable workflow called from build.yml. Scans dependency manifest files
# changing in a PR for known-vulnerable packages, using the rules in
# .github/config/dependency-review-config.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Morphe-PDF: non-blocking. dependency-review needs GitHub's Dependency graph, which
      # is OFF by default on forks and can only be turned on in the UI
      # (Settings > Code security > Dependency graph) - it is not settable via the API.
      # Until it is enabled this action fails with "Dependency review is not supported on
      # this repository", which would red the whole build gate.
      #
      # Dependency vulnerability coverage does not depend on this: the security-scan
      # workflow runs OSV-Scanner across every lockfile and needs no repo setting. Once
      # Dependency graph is enabled, drop continue-on-error to make this blocking again.
      - name: "Dependency Review"
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: "./.github/config/dependency-review-config.yml"
